services:
  # 1. Backend Web Service (Node.js + Express API)
  - type: web
    name: vishakhamam-elearning-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        value: mongodb+srv://hemraj15705_db_user:FQSwPt6wOoiKxdik@cluster0.vbtvej7.mongodb.net/elearning_platform?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_ACCESS_SECRET
        value: vishakhamam_jwt_super_access_production_key_2026_secured
      - key: JWT_REFRESH_SECRET
        value: vishakhamam_jwt_super_refresh_production_key_2026_secured
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://e-learning-8kov.vercel.app

  # 2. Frontend Static Site (React + Vite SPA)
  - type: web
    name: vishakhamam-elearning-web
    env: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vishakhamam-elearning-api.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        value: https://vishakhamam-elearning-api.onrender.com/api/v1
